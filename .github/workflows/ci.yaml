name: ci

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to run the e2e tests against.
        required: false
        default: edge
        type: string
  push:
    branches:
      - main
    paths: &paths
      - .github/workflows/ci.yaml
      - "**/*.go"
      - go.mod
      - go.sum
      - docker-bake.hcl
      - Dockerfile
      - scripts/**
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths

permissions:
  packages: write

jobs:
  build:
    # A manual dispatch is for running the e2e job alone against an existing
    # image, so skip building.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TAG: edge
      BUILD_HASH: ${{ github.sha }}
      BUILD_ID: r${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/bake-action@v7
        with:
          source: .
          targets: test,build
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Login to GHCR
        uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/bake-action@v7
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          source: .
          targets: app
          set: |
            app.platform=linux/amd64
            app.platform=linux/arm64
            app.output=type=registry

  e2e:
    # On a push to main, run after the image has been built and pushed and test
    # that image. On a manual dispatch, skip the build and test the image tagged
    # with the given input instead.
    needs: build
    if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/lesomnus/oras-get:${{ github.event_name == 'workflow_dispatch' && inputs.tag || format('r{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install oras
        uses: oras-project/setup-oras@v1
        with:
          version: 1.3.2

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start zot
        run: |
          docker run -d --name zot --network host \
            -v ${{ github.workspace }}/.github/ci/zot.json:/etc/zot/config.json:ro \
            ghcr.io/project-zot/zot:v2.1.12 serve /etc/zot/config.json

      - name: Start oras-get (image built by the build job)
        run: |
          docker run -d --name oras-get --network host \
            -v ${{ github.workspace }}/.github/ci/oras-get.yaml:/oras-get.yaml:ro \
            "${IMAGE}" serve

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:5000/v2/ >/dev/null && break; sleep 1; done
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:5001/ && break; sleep 1; done

      - name: Run e2e tests
        env:
          ORAS_GET_E2E_REGISTRY: localhost:5000
          ORAS_GET_E2E_TARGET: http://localhost:5001
        run: go test -tags e2e -run TestE2E -v ./...

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "::group::zot";      docker logs zot      || true; echo "::endgroup::"
          echo "::group::oras-get"; docker logs oras-get || true; echo "::endgroup::"
